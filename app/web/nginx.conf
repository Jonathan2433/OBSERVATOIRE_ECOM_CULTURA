# nginx : sert le front statique (build React) + proxifie /api vers l'API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas divulguer la version de nginx (durcissement L8).
    server_tokens off;

    # Limite de taille des uploads (fichiers Excel) — alignée sur la config app.
    client_max_body_size 60m;

    # En-têtes de sécurité (durcissement L8). CSP volontairement stricte : l'app
    # est mono-poste, même origine (front + /api), sans ressource externe — cohérent
    # avec l'offline strict (§7.10). 'unsafe-inline' en style pour les styles inline React.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API (FastAPI) — le préfixe /api est conservé côté upstream.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA : toute route inconnue renvoie index.html (routing côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

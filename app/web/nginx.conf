# nginx : sert le front statique (build React) + proxifie /api vers l'API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Limite de taille des uploads (fichiers Excel) — alignée sur la config app.
    client_max_body_size 60m;

    # API (FastAPI) — le préfixe /api est conservé côté upstream.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA : toute route inconnue renvoie index.html (routing côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

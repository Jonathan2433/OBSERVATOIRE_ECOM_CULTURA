# nginx : sert le front statique (Direction B, vanilla JS) + proxifie /api vers l'API.
# Identique au service `web` d'origine — mêmes garde-fous L8, même proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Limite de taille des uploads (fichiers Excel) — alignée sur la config app.
    client_max_body_size 60m;

    # En-têtes de sécurité (durcissement L8). CSP stricte : app mono-poste, même
    # origine (front + /api), sans ressource externe. Le front Direction B n'utilise
    # aucun script inline (délégation d'évènements) ni ressource distante — compatible.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API (FastAPI) — le préfixe /api est conservé côté upstream.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA : l'état de navigation est côté client, toute route renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
#  Correspondance ancien référentiel (20/67) -> nouveau référentiel (11/59)
#
#  ⚠️ CETTE TABLE EST UN JUGEMENT eXalt, NON VALIDÉ PAR CULTURA.
#
#  Elle n'existe que pour recycler le **jeu factice** du 12/08, annoté dans
#  l'ancien référentiel, en matériel d'entraînement d'appoint — en particulier
#  ses 289 verbatims bi-thèmes et ses 219 exemples de `churn`, denrées rares
#  dans le corpus réel (314 bi-thèmes, 64 churn).
#
#  Elle ne doit JAMAIS servir à :
#    - produire une baseline de l'ancien modèle (D-36 l'a explicitement écarté) ;
#    - comparer des volumes entre l'ancien et le nouveau référentiel ;
#    - réétiqueter des données réelles.
#
#  Deux limites assumées :
#    1. La correspondance est **lossy** : plusieurs sous-thèmes anciens
#       convergent vers un seul nouveau (les 3 de « Retour / Remboursement »
#       vers `Réception commande / Retour produit`, par exemple).
#    2. Certains sous-thèmes nouveaux n'ont **aucun** antécédent : les 4
#       d'`Académie`, les 2 marketplace, `Produits numériques`, `Taille colis`.
#       Le jeu factice n'y apportera rien.
#
#  Clé : "<thème ancien> | <sous-thème ancien>"
#  Valeur : [thème nouveau, sous-thème nouveau]
# =============================================================================
